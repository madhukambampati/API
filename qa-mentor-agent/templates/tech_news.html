{% extends "base.html" %}
{% block title %}TechOrbit — Tech News{% endblock %}
{% block content %}
<div class="section-heading">
  <div>
    <h1 class="page-title" style="margin-bottom: 4px;">📰 Tech News</h1>
    <p class="page-subtitle" style="margin-bottom: 0;">
      What's trending across the tech industry right now, sourced from Hacker News. Refreshes automatically every 30 minutes.
    </p>
  </div>
  <button type="button" class="tool-btn secondary" id="refresh-news-btn">🔄 Refresh</button>
</div>

<p class="settings-note" id="news-updated-text" style="margin-bottom: 20px;" aria-live="polite"></p>

<div id="news-grid" class="resource-grid" aria-live="polite"></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='tech-news.js') }}"></script>
{% endblock %}
