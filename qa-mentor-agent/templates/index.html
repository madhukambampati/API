<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Mentor — AI Learning Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🧪 QA Mentor</h1>
      <p>Your AI learning companion for QA, SDET &amp; AI-QA</p>
    </header>

    <main id="chat" class="chat"></main>

    <form id="chat-form" class="composer">
      <textarea
        id="message-input"
        placeholder="Ask about test design, Selenium, Playwright, API testing, AI-QA..."
        rows="1"
        autofocus
        required
      ></textarea>
      <button type="submit" id="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
          <path
            d="M3 11.5L20 4L12.5 21L10.5 13.5L3 11.5Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </svg>
        Send
      </button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
