{% extends "base.html" %}
{% block title %}QA Mentor — Chat{% endblock %}
{% block content %}
<h1 class="page-title">💬 Chat</h1>
<p class="page-subtitle">Ask anything about QA, SDET, or AI-QA.</p>

<div class="chat-shell">
  <main id="chat" class="chat">
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">🧪</div>
      <h2>What do you want to learn today?</h2>
      <p>Ask a question, or try one of these:</p>
      <div class="suggestions">
        <button type="button" class="suggestion-chip" data-prompt="What's the difference between explicit and implicit waits in Selenium?">
          <span class="chip-icon">🧭</span><span>Selenium waits explained</span>
        </button>
        <button type="button" class="suggestion-chip" data-prompt="Give me a 6-month roadmap to go from manual tester to SDET.">
          <span class="chip-icon">🗺️</span><span>Manual → SDET roadmap</span>
        </button>
        <button type="button" class="suggestion-chip" data-prompt="Walk me through testing a REST API with Postman, step by step.">
          <span class="chip-icon">🌐</span><span>API testing basics</span>
        </button>
        <button type="button" class="suggestion-chip" data-prompt="What is AI-QA, and how is testing an LLM feature different from testing normal software?">
          <span class="chip-icon">🤖</span><span>What is AI-QA?</span>
        </button>
      </div>
    </div>
  </main>

  <form id="chat-form" class="composer">
    <textarea
      id="message-input"
      placeholder="Ask about test design, Selenium, Playwright, API testing, AI-QA..."
      rows="1"
      autofocus
      required
    ></textarea>
    <button type="submit" id="send-btn" aria-label="Send message">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
        <path d="M3 11.5L20 4L12.5 21L10.5 13.5L3 11.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" />
      </svg>
      Send
    </button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='chat.js') }}"></script>
{% endblock %}
