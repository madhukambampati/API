{% extends "base.html" %}
{% block title %}TechOrbit — Chat{% endblock %}
{% block content %}
<h1 class="page-title">💬 Chat</h1>
<p class="page-subtitle" id="chat-subtitle">Ask anything about QA, SDET, or AI-QA.</p>

<div class="mentor-mode-row">
  <label for="mentor-mode-select" class="mentor-mode-label">Mentor mode</label>
  <select id="mentor-mode-select">
    {% for key, mode in mentor_modes.items() %}
    <option value="{{ key }}" {{ "selected" if key == default_mentor_mode }}>{{ mode.label }}</option>
    {% endfor %}
  </select>
</div>

<div class="chat-shell">
  <main id="chat" class="chat" aria-live="polite">
    <div id="empty-state" class="chat-hero">
      <svg class="mascot-svg" viewBox="0 0 120 132" width="100" height="110" aria-hidden="true">
        <defs>
          <linearGradient id="mascotGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--accent)" />
            <stop offset="100%" stop-color="var(--accent-2)" />
          </linearGradient>
        </defs>
        <path
          d="M20 8 H100 A18 18 0 0 1 118 26 V76 A18 18 0 0 1 100 94 H55 L38 116 V94 H20 A18 18 0 0 1 2 76 V26 A18 18 0 0 1 20 8 Z"
          fill="url(#mascotGrad)"
          stroke="currentColor"
          stroke-width="5"
          stroke-linejoin="round"
        />
        <ellipse cx="45" cy="46" rx="7" ry="10" fill="#0f172a" />
        <ellipse cx="78" cy="46" rx="7" ry="10" fill="#0f172a" />
      </svg>
      <h2 id="greeting-text">Hi there!</h2>
      <p class="chat-hero-tagline">I'm your TechOrbit AI mentor. Ready when you are!</p>
      <div class="hero-pills" id="hero-pills"></div>
    </div>
  </main>

  <form id="chat-form" class="composer">
    <label for="message-input" class="sr-only">Ask a question</label>
    <textarea
      id="message-input"
      placeholder="Ask about test design, Selenium, Playwright, API testing, AI-QA..."
      rows="1"
      autofocus
      required
    ></textarea>
    <button
      type="button"
      id="mic-btn"
      class="mic-btn"
      aria-label="Press and hold to record"
      data-tooltip="Press and hold to record"
      style="display: none;"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" />
        <path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <line x1="8" y1="22" x2="16" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    <button type="submit" id="send-btn" aria-label="Send message">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
        <path d="M3 11.5L20 4L12.5 21L10.5 13.5L3 11.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" />
      </svg>
      Send
    </button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='chat.js') }}"></script>
{% endblock %}
